<ion-menu contentId="main-content" side="start">
  <ion-header class="ion-no-border">
    <ion-toolbar>
      <ion-title>
        <span class="logo"><span class="punto"></span>handyman</span>
      </ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <div class="perfil">
      <ion-avatar>{{ inicial() }}</ion-avatar>
      <div class="datos">
        <strong>{{ nombre() || 'Usuario' }}</strong>
        <span class="pill">{{ etiquetaRol() }}</span>
      </div>
    </div>

    <ion-list lines="none">
      @for (item of items(); track item.ruta) {
        <ion-menu-toggle auto-hide="false">
          <ion-item button (click)="ir(item.ruta)">
            <ion-icon [name]="item.icono" slot="start"></ion-icon>
            <ion-label>{{ item.etiqueta }}</ion-label>
          </ion-item>
        </ion-menu-toggle>
      }
    </ion-list>

    <ion-menu-toggle auto-hide="false" class="salir">
      <ion-item button (click)="cerrasrSession()">
        <ion-icon name="log-out-outline" slot="start"></ion-icon>
        <ion-label>Cerrar sesión</ion-label>
      </ion-item>
    </ion-menu-toggle>
  </ion-content>
</ion-menu>
