<ion-content class="ion-padding">
  <div class="login-container">
    <h1 class="titulo">Bienvenido de nuevo</h1>
    <p class="subtitulo">Elige cómo quieres entrar a HandymanApp</p>

    <ion-segment
      [value]="rolSeleccionado"
      (ionChange)="seleccionarRol($event.detail.value)"
      class="segmento-rol"
    >
      <ion-segment-button value="cliente">
        <ion-label>Cliente</ion-label>
      </ion-segment-button>
      <ion-segment-button value="handyman">
        <ion-label>Handyman</ion-label>
      </ion-segment-button>
    </ion-segment>


    <form [formGroup]="form" (ngSubmit)="ingresar()">
      <ion-item class="campo" lines="none">
        <ion-label position="stacked">Correo electrónico</ion-label>
        <ion-input
          formControlName="email"
          type="email"
          placeholder="tu@correo.com"
          inputmode="email"
        ></ion-input>
      </ion-item>

      <ion-item class="campo" lines="none">
        <ion-label position="stacked">Contraseña</ion-label>
        <ion-input
          formControlName="password"
          type="password"
          placeholder="••••••••"
        ></ion-input>
      </ion-item>

      <ion-button
        expand="block"
        type="submit"
        shape="round"
        class="boton-ingresar"
        [disabled]="cargando"
      >
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </ion-button>
    </form>

    <ion-button
      expand="block"
      fill="outline"
      shape="round"
      class="boton-crear-cuenta"
      (click)="irARegistro()"
    >
      Crear cuenta nueva
    </ion-button>

    <p class="link-handyman" *ngIf="rolSeleccionado === 'cliente'">
      ¿Eres handyman y quieres ofrecer tus servicios?
      <a (click)="seleccionarRol('handyman')">Cambia aquí</a>
    </p>
  </div>
</ion-content>
