<ion-header class="ion-no-border">

    <div class="barra">
      <div class="logo-container">
        <!-- Reemplaza con el nombre de tu imagen transparente -->
        <img src="assets/Logo_Header-HandyMan.jpg" alt="Handyman Logo" class="logo-img" />

      <div class="acciones">

      </div>
    </div>
  </ion-toolbar>
</ion-header>
